[package]
name = "fortress-protocol"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true
panic = "unwind"
incremental = true

# Optimize dependencies even in dev builds; to make things faster
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
crossbeam = "0.8"
futures = "0.3"
bytes = { version = "1.0", features = ["serde"] }
bincode = "1.3.3"
rand = "0.8"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
local-channel = "0.1.5"
local-sync = "0.1.1"
gdt-cpus = "0.2606.1"
heapless = "0.9.3"
crossfire = "3.1.20"
arrayvec = { version = "0.7.8", features = ["serde"] }

[profile.samply]
inherits = "release"
debug = true
