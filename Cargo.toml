[package]
name = "fortress-protocol"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3           # Maximum speed optimizations
lto = "fat"             # Aggressive link-time optimization across all crates
codegen-units = 1       # Single compilation unit yields maximum LLVM optimization scope
panic = "abort"         # Removes unwind overhead, stack frames, and landing pads
strip = "symbols"       # Strips symbol tables to reduce binary size and improve cache locality

[dependencies]
tokio = { version = "1.50", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
dashmap = "6.1.0"
crossbeam = "0.8"
futures = "0.3"
bytes = { version = "1.0", features = ["serde"] }
prost = "0.14"
bincode = "1.3.3"
sha2 = "0.11.0"
rand = "0.8"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
local-channel = "0.1.5"
local-sync = "0.1.1"
gdt-cpus = "0.2606.1"
heapless = "0.9.3"
crossfire = "3.1.20"
arrayvec = "0.7.8"

[profile.samply]
inherits = "release"
debug = true
